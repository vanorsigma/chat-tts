[project]
name = "summariser"
version = "0.1.0"
description = "Per-category rolling chat/stream summariser"
readme = "README.md"
authors = [
    { name = "vanor-sigma", email = "240724400+vanor-sigma@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "chromadb>=0.6.0",
    "mss>=9.0.1",
    "openai>=2.9.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.30.1",
    "setuptools<82",
    "sherpa-onnx>=1.13.8",
    # Ships libonnxruntime.so; uv does not pull it from sherpa-onnx's metadata.
    "sherpa-onnx-core>=1.13.8",
    "sounddevice>=0.5.5",
    "websockets>=15.0.1",
]

[project.scripts]
summariser = "summariser:main"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pyright>=1.1.407",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
